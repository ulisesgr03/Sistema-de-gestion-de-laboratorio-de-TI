<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="l4-bg" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#192825"/>
      <stop offset="55%" stop-color="#283F3B"/>
      <stop offset="100%" stop-color="#14211E"/>
    </linearGradient>
    <linearGradient id="l4-cuda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99DDC8"/>
      <stop offset="100%" stop-color="#95BF74"/>
    </linearGradient>
    <pattern id="l4-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#556F44" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="600" height="300" rx="16" fill="url(#l4-bg)"/>
  <rect width="600" height="300" rx="16" fill="url(#l4-grid)"/>

  <!-- Left: NVIDIA RTX 4070 Workstation Rig & Tensor Architecture -->
  <g transform="translate(60, 35)">
    <!-- Chassis / PCIe Enclosure -->
    <rect x="0" y="0" width="210" height="230" rx="12" fill="#182421" stroke="#556F44" stroke-width="2"/>
    <rect x="12" y="12" width="186" height="40" rx="6" fill="#20332F" stroke="#659B5E" stroke-width="1.2"/>
    <text x="24" y="32" fill="#99DDC8" font-family="sans-serif" font-size="11" font-weight="black">NVIDIA RTX 4070 · 12GB</text>
    <text x="24" y="44" fill="#95BF74" font-family="monospace" font-size="8">5,888 CUDA Cores · Ada Lovelace</text>

    <!-- Dual Axial Fans with Geometric Fin Grids -->
    <g transform="translate(30, 68)">
      <!-- Fan 1 -->
      <circle cx="36" cy="40" r="34" fill="#141E1C" stroke="#659B5E" stroke-width="2"/>
      <circle cx="36" cy="40" r="14" fill="#283F3B" stroke="#99DDC8" stroke-width="1.5"/>
      <path d="M 36 6 L 36 26 M 36 54 L 36 74 M 2 40 L 22 40 M 50 40 L 70 40" stroke="#99DDC8" stroke-width="1.8" opacity="0.8"/>
      <!-- Fan 2 -->
      <circle cx="114" cy="40" r="34" fill="#141E1C" stroke="#659B5E" stroke-width="2"/>
      <circle cx="114" cy="40" r="14" fill="#283F3B" stroke="#99DDC8" stroke-width="1.5"/>
      <path d="M 114 6 L 114 26 M 114 54 L 114 74 M 80 40 L 100 40 M 128 40 L 148 40" stroke="#99DDC8" stroke-width="1.8" opacity="0.8"/>
    </g>

    <!-- PCIe Gen4 Gold Connector & Status Metrics -->
    <rect x="14" y="160" width="182" height="55" rx="6" fill="#131C1A" stroke="#556F44" stroke-width="1.2"/>
    <g transform="translate(24, 172)">
      <text x="0" y="10" fill="#C5D9C0" font-family="monospace" font-size="8.5">GPU Compute Load: 94%</text>
      <rect x="0" y="15" width="162" height="6" rx="2" fill="#22332F"/>
      <rect x="0" y="15" width="152" height="6" rx="2" fill="url(#l4-cuda)"/>

      <text x="0" y="32" fill="#C5D9C0" font-family="monospace" font-size="8.5">VRAM Alloc: 9.8 / 12 GB</text>
      <rect x="0" y="37" width="162" height="6" rx="2" fill="#22332F"/>
      <rect x="0" y="37" width="132" height="6" rx="2" fill="#95BF74"/>
    </g>
  </g>

  <!-- Right: Deep Learning Neural Network Topology (PyTorch + CUDA) -->
  <g transform="translate(300, 35)">
    <rect x="0" y="0" width="240" height="230" rx="12" fill="#172320" stroke="#659B5E" stroke-width="2"/>
    <rect x="12" y="12" width="216" height="32" rx="6" fill="#20332F" stroke="#556F44" stroke-width="1"/>
    <text x="22" y="28" fill="#99DDC8" font-family="sans-serif" font-size="10" font-weight="bold">PyTorch 2.5 · ResNet-50 Pipeline</text>
    <text x="22" y="38" fill="#95BF74" font-family="monospace" font-size="8">Batch Size: 128 · Loss: 0.0421</text>

    <!-- Neural Network Layers (Input -> Hidden1 -> Hidden2 -> Output) -->
    <g transform="translate(20, 60)">
      <!-- Connections -->
      <g stroke="#556F44" stroke-width="1" opacity="0.6">
        <line x1="20" y1="20" x2="70" y2="10"/>
        <line x1="20" y1="20" x2="70" y2="40"/>
        <line x1="20" y1="20" x2="70" y2="70"/>
        <line x1="20" y1="50" x2="70" y2="10"/>
        <line x1="20" y1="50" x2="70" y2="40"/>
        <line x1="20" y1="50" x2="70" y2="70"/>
        <line x1="20" y1="80" x2="70" y2="10"/>
        <line x1="20" y1="80" x2="70" y2="40"/>
        <line x1="20" y1="80" x2="70" y2="70"/>

        <line x1="70" y1="10" x2="130" y2="20"/>
        <line x1="70" y1="40" x2="130" y2="40"/>
        <line x1="70" y1="70" x2="130" y2="60"/>

        <line x1="130" y1="20" x2="180" y2="35"/>
        <line x1="130" y1="40" x2="180" y2="35"/>
        <line x1="130" y1="60" x2="180" y2="55"/>
      </g>

      <!-- Input Layer (3 nodes) -->
      <circle cx="20" cy="20" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <circle cx="20" cy="50" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <circle cx="20" cy="80" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>

      <!-- Hidden Layer 1 (4 nodes) -->
      <circle cx="70" cy="10" r="8" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>
      <circle cx="70" cy="35" r="8" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>
      <circle cx="70" cy="60" r="8" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>
      <circle cx="70" cy="85" r="8" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>

      <!-- Hidden Layer 2 (3 nodes) -->
      <circle cx="130" cy="20" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <circle cx="130" cy="40" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <circle cx="130" cy="60" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>

      <!-- Output Layer (2 nodes) -->
      <circle cx="180" cy="35" r="9" fill="#95BF74" stroke="#99DDC8" stroke-width="2"/>
      <circle cx="180" cy="55" r="9" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>
    </g>

    <!-- Loss Graph Box -->
    <rect x="14" y="165" width="212" height="52" rx="6" fill="#121C1A" stroke="#556F44" stroke-width="1.2"/>
    <path d="M 24 205 Q 60 178 100 175 T 160 172 T 216 170" fill="none" stroke="#99DDC8" stroke-width="2"/>
    <text x="24" y="180" fill="#95BF74" font-family="monospace" font-size="8">Convergence Curve (Loss -> 0)</text>
  </g>
</svg>
