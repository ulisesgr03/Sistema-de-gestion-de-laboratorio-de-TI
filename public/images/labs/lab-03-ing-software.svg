<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="l3-bg" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2B28"/>
      <stop offset="60%" stop-color="#283F3B"/>
      <stop offset="100%" stop-color="#182422"/>
    </linearGradient>
    <pattern id="l3-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#556F44" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="600" height="300" rx="16" fill="url(#l3-bg)"/>
  <rect width="600" height="300" rx="16" fill="url(#l3-grid)"/>

  <!-- Left / Center: High-Performance Multi-Monitor DevOps Setup -->
  <g transform="translate(50, 30)">
    <!-- Primary Ultra-Wide Monitor (Code Editor VS Code) -->
    <rect x="0" y="10" width="280" height="170" rx="8" fill="#15201E" stroke="#659B5E" stroke-width="2"/>
    <!-- Top Window Chrome -->
    <rect x="8" y="18" width="264" height="20" rx="4" fill="#20322E"/>
    <circle cx="20" cy="28" r="3.5" fill="#EF4444"/>
    <circle cx="30" cy="28" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="28" r="3.5" fill="#99DDC8"/>
    <text x="56" y="32" fill="#99DDC8" font-family="monospace" font-size="9" font-weight="bold">MetalNet-Core · Dockerfile (Prod)</text>

    <!-- Side File Tree -->
    <rect x="8" y="42" width="60" height="130" fill="#192623" stroke="#2B3F3B" stroke-width="1"/>
    <g fill="#95BF74" opacity="0.85" font-family="monospace" font-size="8">
      <text x="14" y="56">> src/</text>
      <text x="14" y="70">> api/</text>
      <text x="14" y="84">  app.ts</text>
      <text x="14" y="98">  db.ts</text>
      <text x="14" y="112">> test/</text>
      <text x="14" y="126">  cicd.yml</text>
    </g>

    <!-- Code Editor Body -->
    <rect x="72" y="42" width="200" height="130" fill="#131C1A"/>
    <g font-family="monospace" font-size="8.5">
      <text x="82" y="58" fill="#95BF74">FROM node:22-alpine AS builder</text>
      <text x="82" y="72" fill="#C5D9C0">WORKDIR /app &amp;&amp; COPY package*.json ./</text>
      <text x="82" y="86" fill="#99DDC8">RUN npm ci --omit=dev &amp;&amp; npm run build</text>
      <text x="82" y="100" fill="#95BF74">EXPOSE 8080</text>
      <text x="82" y="114" fill="#F59E0B">HEALTHCHECK --interval=5s CMD curl localhost</text>
      <text x="82" y="128" fill="#99DDC8">CMD ["node", "dist/server.js"]</text>
      <text x="82" y="146" fill="#659B5E">// Git Commit: f82a90 · Clean Architecture</text>
      <text x="82" y="160" fill="#99DDC8">ready: compiled in 312ms █</text>
    </g>

    <!-- Ergonomic Monitor Arm -->
    <rect x="125" y="180" width="30" height="24" fill="#20302C" stroke="#556F44" stroke-width="1.2"/>
    <rect x="95" y="204" width="90" height="6" rx="3" fill="#283F3B" stroke="#659B5E" stroke-width="1.2"/>
  </g>

  <!-- Right: CI/CD Pipeline & Docker Microservices Topology -->
  <g transform="translate(360, 40)">
    <rect x="0" y="0" width="190" height="220" rx="10" fill="#182522" stroke="#659B5E" stroke-width="2"/>
    <rect x="12" y="12" width="166" height="26" rx="5" fill="#223531"/>
    <text x="22" y="29" fill="#99DDC8" font-family="sans-serif" font-size="10" font-weight="bold">GitLab CI/CD Pipeline</text>

    <!-- Pipeline Stages (Build -> Test -> Deploy) -->
    <g transform="translate(20, 50)">
      <!-- Stage 1: Build -->
      <circle cx="16" cy="18" r="14" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <path d="M 12 18 L 15 21 L 21 14" stroke="#99DDC8" stroke-width="2" fill="none"/>
      <text x="36" y="17" fill="#F3F7F5" font-family="sans-serif" font-size="9" font-weight="bold">Build App</text>
      <text x="36" y="27" fill="#95BF74" font-family="monospace" font-size="8">Passed (24s)</text>

      <!-- Connecting Line -->
      <line x1="16" y1="32" x2="16" y2="44" stroke="#99DDC8" stroke-width="2"/>

      <!-- Stage 2: Test -->
      <circle cx="16" cy="58" r="14" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <path d="M 12 58 L 15 61 L 21 54" stroke="#99DDC8" stroke-width="2" fill="none"/>
      <text x="36" y="57" fill="#F3F7F5" font-family="sans-serif" font-size="9" font-weight="bold">Unit &amp; E2E</text>
      <text x="36" y="67" fill="#95BF74" font-family="monospace" font-size="8">148 tests OK</text>

      <!-- Connecting Line -->
      <line x1="16" y1="72" x2="16" y2="84" stroke="#99DDC8" stroke-width="2"/>

      <!-- Stage 3: Docker Registry -->
      <circle cx="16" cy="98" r="14" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>
      <path d="M 12 98 L 15 101 L 21 94" stroke="#95BF74" stroke-width="2" fill="none"/>
      <text x="36" y="97" fill="#F3F7F5" font-family="sans-serif" font-size="9" font-weight="bold">Docker Push</text>
      <text x="36" y="107" fill="#95BF74" font-family="monospace" font-size="8">metalnet/app:v2</text>
    </g>

    <!-- Bottom Container Cluster -->
    <rect x="14" y="165" width="162" height="42" rx="6" fill="#15201E" stroke="#556F44" stroke-width="1"/>
    <circle cx="28" cy="186" r="6" fill="#99DDC8"/>
    <text x="40" y="184" fill="#99DDC8" font-family="monospace" font-size="8.5" font-weight="bold">PostgreSQL 16 Cluster</text>
    <text x="40" y="195" fill="#C5D9C0" font-family="monospace" font-size="7.5">Primary + 2 Replicas</text>
  </g>
</svg>
