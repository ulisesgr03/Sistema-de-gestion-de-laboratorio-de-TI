<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="l8-bg" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182623"/>
      <stop offset="60%" stop-color="#283F3B"/>
      <stop offset="100%" stop-color="#15211E"/>
    </linearGradient>
    <pattern id="l8-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#556F44" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="600" height="300" rx="16" fill="url(#l8-bg)"/>
  <rect width="600" height="300" rx="16" fill="url(#l8-grid)"/>

  <!-- Left: Database Cylinder Stacks (Distributed SQL / PostgreSQL / Cloud Storage) -->
  <g transform="translate(60, 45)">
    <!-- DB Cluster 1 (Primary) -->
    <g transform="translate(0, 0)">
      <!-- Cylinder 1 Top Disk -->
      <ellipse cx="60" cy="20" rx="55" ry="16" fill="#20332F" stroke="#99DDC8" stroke-width="2"/>
      <path d="M 5 20 V 46 C 5 56 30 62 60 62 C 90 62 115 56 115 46 V 20" fill="#182724" stroke="#99DDC8" stroke-width="2"/>
      <ellipse cx="60" cy="46" rx="55" ry="16" fill="none" stroke="#659B5E" stroke-width="1.2"/>
      
      <!-- Cylinder 1 Mid Disk -->
      <path d="M 5 46 V 76 C 5 86 30 92 60 92 C 90 92 115 86 115 76 V 46" fill="#182724" stroke="#99DDC8" stroke-width="2"/>
      <ellipse cx="60" cy="76" rx="55" ry="16" fill="none" stroke="#659B5E" stroke-width="1.2"/>

      <!-- Cylinder 1 Bottom Disk -->
      <path d="M 5 76 V 106 C 5 116 30 122 60 122 C 90 122 115 116 115 106 V 76" fill="#182724" stroke="#99DDC8" stroke-width="2"/>

      <text x="32" y="68" fill="#99DDC8" font-family="monospace" font-size="10" font-weight="bold">PostgreSQL</text>
      <text x="38" y="98" fill="#95BF74" font-family="monospace" font-size="8.5">Master Node</text>
    </g>

    <!-- DB Cluster 2 (Replica) -->
    <g transform="translate(135, 30)">
      <ellipse cx="50" cy="18" rx="45" ry="14" fill="#20332F" stroke="#95BF74" stroke-width="1.8"/>
      <path d="M 5 18 V 40 C 5 48 25 54 50 54 C 75 54 95 48 95 40 V 18" fill="#182724" stroke="#95BF74" stroke-width="1.8"/>
      <path d="M 5 40 V 68 C 5 76 25 82 50 82 C 75 82 95 76 95 68 V 40" fill="#182724" stroke="#95BF74" stroke-width="1.8"/>
      <path d="M 5 68 V 94 C 5 102 25 108 50 108 C 75 108 95 102 95 94 V 68" fill="#182724" stroke="#95BF74" stroke-width="1.8"/>

      <text x="26" y="58" fill="#95BF74" font-family="monospace" font-size="9" font-weight="bold">Replica-01</text>
      <text x="28" y="86" fill="#C5D9C0" font-family="monospace" font-size="8">Sync Wal</text>
    </g>

    <!-- Replication Arrow -->
    <path d="M 115 50 Q 130 50 135 60" stroke="#99DDC8" stroke-width="2" fill="none" stroke-dasharray="3 2"/>
  </g>

  <!-- Right: Kubernetes Cloud Cluster & Pod Architecture -->
  <g transform="translate(320, 35)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="#172320" stroke="#659B5E" stroke-width="2"/>
    <rect x="12" y="12" width="196" height="30" rx="5" fill="#20332F"/>
    <text x="22" y="30" fill="#99DDC8" font-family="sans-serif" font-size="10" font-weight="bold">Kubernetes Cluster (K8s) v1.31</text>

    <!-- 3 Cloud Pod Nodes -->
    <g transform="translate(18, 55)">
      <!-- Pod 1 -->
      <rect x="0" y="0" width="184" height="42" rx="6" fill="#1E2F2B" stroke="#99DDC8" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="1.5"/>
      <text x="36" y="18" fill="#F3F7F5" font-family="monospace" font-size="8.5" font-weight="bold">pod/api-gateway-7f89b</text>
      <text x="36" y="30" fill="#95BF74" font-family="monospace" font-size="8">Status: Running · 2/2 ready</text>

      <!-- Pod 2 -->
      <rect x="0" y="50" width="184" height="42" rx="6" fill="#1E2F2B" stroke="#95BF74" stroke-width="1.2"/>
      <circle cx="20" cy="71" r="8" fill="#283F3B" stroke="#95BF74" stroke-width="1.5"/>
      <text x="36" y="68" fill="#F3F7F5" font-family="monospace" font-size="8.5" font-weight="bold">pod/auth-service-5d62c</text>
      <text x="36" y="80" fill="#95BF74" font-family="monospace" font-size="8">Status: Running · 1/1 ready</text>

      <!-- Pod 3 -->
      <rect x="0" y="100" width="184" height="42" rx="6" fill="#1E2F2B" stroke="#99DDC8" stroke-width="1.2"/>
      <circle cx="20" cy="121" r="8" fill="#283F3B" stroke="#99DDC8" stroke-width="1.5"/>
      <text x="36" y="118" fill="#F3F7F5" font-family="monospace" font-size="8.5" font-weight="bold">pod/worker-queue-9a11f</text>
      <text x="36" y="130" fill="#99DDC8" font-family="monospace" font-size="8">Throughput: 14.8k ops/s</text>
    </g>

    <rect x="14" y="180" width="192" height="34" rx="6" fill="#131C1A" stroke="#556F44" stroke-width="1"/>
    <circle cx="28" cy="197" r="4" fill="#99DDC8"/>
    <text x="38" y="201" fill="#99DDC8" font-family="monospace" font-size="8.5" font-weight="bold">2.5 GbE CLUSTER NETWORK</text>
  </g>
</svg>
