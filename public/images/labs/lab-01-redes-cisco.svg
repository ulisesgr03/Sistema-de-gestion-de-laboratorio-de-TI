<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <defs>
    <linearGradient id="l1-bg" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2B28"/>
      <stop offset="60%" stop-color="#283F3B"/>
      <stop offset="100%" stop-color="#1A2624"/>
    </linearGradient>
    <linearGradient id="l1-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#99DDC8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#99DDC8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="l1-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#556F44" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="16" fill="url(#l1-bg)"/>
  <rect width="600" height="300" rx="16" fill="url(#l1-grid)"/>

  <!-- Technical Overlay Glow -->
  <circle cx="300" cy="150" r="160" fill="url(#l1-glow)" filter="blur(30px)"/>

  <!-- Cisco Catalyst Rack 1 (Left) -->
  <g transform="translate(60, 30)">
    <!-- Rack Cabinet -->
    <rect x="0" y="0" width="160" height="240" rx="10" fill="#182321" stroke="#556F44" stroke-width="2"/>
    <rect x="10" y="10" width="140" height="220" rx="6" fill="#121A18" stroke="#659B5E" stroke-width="1"/>

    <!-- Patch Panel Unit 1 -->
    <rect x="18" y="24" width="124" height="28" rx="4" fill="#20302D" stroke="#556F44" stroke-width="1.2"/>
    <!-- Ports -->
    <g fill="#99DDC8" opacity="0.9">
      <rect x="28" y="32" width="6" height="6" rx="1"/>
      <rect x="38" y="32" width="6" height="6" rx="1"/>
      <rect x="48" y="32" width="6" height="6" rx="1"/>
      <rect x="58" y="32" width="6" height="6" rx="1"/>
      <rect x="72" y="32" width="6" height="6" rx="1"/>
      <rect x="82" y="32" width="6" height="6" rx="1"/>
      <rect x="92" y="32" width="6" height="6" rx="1"/>
      <rect x="102" y="32" width="6" height="6" rx="1"/>
    </g>
    <circle cx="126" cy="35" r="3" fill="#95BF74"/>
    <circle cx="134" cy="35" r="2" fill="#F59E0B"/>

    <!-- Cisco Core Switch 3850 Unit 2 -->
    <rect x="18" y="60" width="124" height="36" rx="4" fill="#243834" stroke="#659B5E" stroke-width="1.5"/>
    <rect x="26" y="68" width="50" height="12" rx="2" fill="#152220"/>
    <g fill="#99DDC8">
      <circle cx="32" cy="74" r="2"/>
      <circle cx="40" cy="74" r="2"/>
      <circle cx="48" cy="74" r="2"/>
      <circle cx="56" cy="74" r="2"/>
      <circle cx="64" cy="74" r="2"/>
    </g>
    <!-- SFP+ Fiber Modules -->
    <rect x="86" y="68" width="14" height="20" rx="2" fill="#182321" stroke="#95BF74" stroke-width="1"/>
    <rect x="104" y="68" width="14" height="20" rx="2" fill="#182321" stroke="#95BF74" stroke-width="1"/>
    <circle cx="93" cy="78" r="2.5" fill="#99DDC8"/>
    <circle cx="111" cy="78" r="2.5" fill="#99DDC8"/>

    <!-- Cisco Router ASR 1001-X Unit 3 -->
    <rect x="18" y="104" width="124" height="42" rx="4" fill="#20302D" stroke="#556F44" stroke-width="1.2"/>
    <line x1="28" y1="120" x2="90" y2="120" stroke="#95BF74" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="28" y1="126" x2="70" y2="126" stroke="#99DDC8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="116" cy="122" r="4" fill="#95BF74"/>
    <circle cx="128" cy="122" r="3" fill="#99DDC8"/>

    <!-- Cable Organizer / Brush Panel -->
    <rect x="18" y="154" width="124" height="18" rx="3" fill="#152220" stroke="#3A534E" stroke-width="1"/>
    <line x1="26" y1="163" x2="134" y2="163" stroke="#659B5E" stroke-width="2" stroke-linecap="round"/>

    <!-- UPS Power Distribution Unit (Bottom) -->
    <rect x="18" y="180" width="124" height="38" rx="4" fill="#1A2623" stroke="#556F44" stroke-width="1.2"/>
    <rect x="28" y="190" width="32" height="18" rx="2" fill="#0E1614" stroke="#659B5E" stroke-width="1"/>
    <text x="32" y="203" fill="#99DDC8" font-family="monospace" font-size="8" font-weight="bold">230V</text>
    <circle cx="76" cy="199" r="4" fill="#95BF74"/>
    <circle cx="90" cy="199" r="4" fill="#95BF74"/>
    <circle cx="104" cy="199" r="4" fill="#95BF74"/>
    <circle cx="118" cy="199" r="4" fill="#F59E0B"/>
  </g>

  <!-- Fiber Cable Trunks Connecting to Right Side -->
  <path d="M 204 78 C 260 78 260 110 320 110" stroke="#99DDC8" stroke-width="3" fill="none" opacity="0.85"/>
  <path d="M 204 84 C 270 84 270 140 320 140" stroke="#95BF74" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 204 122 C 250 122 250 170 320 170" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.75"/>

  <!-- Right Side: High-End Telecom Topology & Workstation -->
  <g transform="translate(320, 40)">
    <!-- Diagram Card / Glass Panel -->
    <rect x="0" y="0" width="220" height="220" rx="12" fill="#182522" stroke="#659B5E" stroke-width="2" opacity="0.95"/>
    <rect x="12" y="12" width="196" height="50" rx="8" fill="#20332F" stroke="#556F44" stroke-width="1"/>

    <!-- Topology Nodes -->
    <g transform="translate(30, 25)">
      <circle cx="20" cy="12" r="10" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <text x="16" y="16" fill="#99DDC8" font-family="sans-serif" font-size="10" font-weight="bold">R1</text>

      <circle cx="80" cy="12" r="10" fill="#283F3B" stroke="#95BF74" stroke-width="2"/>
      <text x="76" y="16" fill="#95BF74" font-family="sans-serif" font-size="10" font-weight="bold">R2</text>

      <circle cx="140" cy="12" r="10" fill="#283F3B" stroke="#99DDC8" stroke-width="2"/>
      <text x="136" y="16" fill="#99DDC8" font-family="sans-serif" font-size="10" font-weight="bold">SW</text>

      <line x1="30" y1="12" x2="70" y2="12" stroke="#99DDC8" stroke-width="2" stroke-dasharray="3 2"/>
      <line x1="90" y1="12" x2="130" y2="12" stroke="#95BF74" stroke-width="2"/>
    </g>

    <!-- Workstation Dual Display on Desk -->
    <g transform="translate(24, 75)">
      <!-- Main Curved Monitor -->
      <rect x="0" y="0" width="110" height="70" rx="4" fill="#121A18" stroke="#99DDC8" stroke-width="1.8"/>
      <!-- Monitor Screen Contents (Wireshark packet stream simulation) -->
      <rect x="6" y="6" width="98" height="58" rx="2" fill="#1A2624"/>
      <line x1="12" y1="16" x2="96" y2="16" stroke="#99DDC8" stroke-width="1.5"/>
      <line x1="12" y1="24" x2="80" y2="24" stroke="#95BF74" stroke-width="1.2"/>
      <line x1="12" y1="32" x2="90" y2="32" stroke="#C5D9C0" stroke-width="1.2"/>
      <line x1="12" y1="40" x2="75" y2="40" stroke="#99DDC8" stroke-width="1.2"/>
      <line x1="12" y1="48" x2="88" y2="48" stroke="#95BF74" stroke-width="1.2"/>
      <line x1="12" y1="56" x2="60" y2="56" stroke="#F59E0B" stroke-width="1.2"/>
      <!-- Monitor Stand -->
      <path d="M 45 70 L 65 70 L 68 84 L 42 84 Z" fill="#283F3B" stroke="#556F44" stroke-width="1"/>
      <rect x="36" y="84" width="38" height="4" rx="2" fill="#556F44"/>

      <!-- Secondary Vertical Monitor -->
      <rect x="120" y="-8" width="48" height="78" rx="4" fill="#121A18" stroke="#659B5E" stroke-width="1.5"/>
      <rect x="124" y="-4" width="40" height="70" rx="2" fill="#172220"/>
      <line x1="128" y1="6" x2="160" y2="6" stroke="#95BF74" stroke-width="1.2"/>
      <line x1="128" y1="14" x2="155" y2="14" stroke="#99DDC8" stroke-width="1"/>
      <line x1="128" y1="22" x2="158" y2="22" stroke="#C5D9C0" stroke-width="1"/>
      <line x1="128" y1="30" x2="145" y2="30" stroke="#95BF74" stroke-width="1"/>
      <line x1="128" y1="38" x2="160" y2="38" stroke="#99DDC8" stroke-width="1"/>
      <line x1="128" y1="46" x2="150" y2="46" stroke="#F59E0B" stroke-width="1"/>
      <line x1="128" y1="54" x2="158" y2="54" stroke="#C5D9C0" stroke-width="1"/>

      <!-- Desk Surface -->
      <rect x="-10" y="88" width="190" height="12" rx="3" fill="#283F3B" stroke="#659B5E" stroke-width="1.2"/>
      <!-- Keyboard & Mouse -->
      <rect x="25" y="91" width="55" height="5" rx="1" fill="#15201E" stroke="#556F44" stroke-width="1"/>
      <ellipse cx="94" cy="93.5" rx="4" ry="2.5" fill="#15201E" stroke="#556F44" stroke-width="1"/>
    </g>

    <!-- Status Pill at Bottom -->
    <rect x="20" y="185" width="180" height="24" rx="6" fill="#20332F" stroke="#95BF74" stroke-width="1"/>
    <circle cx="34" cy="197" r="4" fill="#99DDC8"/>
    <text x="46" y="201" fill="#99DDC8" font-family="monospace" font-size="9" font-weight="bold">CISCO NETACAD · 10 GbE</text>
  </g>
</svg>
